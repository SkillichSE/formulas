<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formula Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
:root{
  --blueprint:       #0E2A47;
  --blueprint-deep:  #0A2038;
  --grid-line:       rgba(255,255,255,0.055);
  --paper:       #F0EAD6;
  --card-ink:    #12233A;
  --card-ink-faint: rgba(18,35,58,0.55);
  --amber:      #D99A34;
  --chalk:      #DCD5BF;
  --ink-faint:  rgba(220,213,191,0.5);
}
*{ box-sizing:border-box; }
html,body{ margin:0; min-height:100vh; }
body{
  font-family:'IBM Plex Sans', sans-serif;
  color:var(--chalk);
  background: var(--blueprint);
  display:flex;
  align-items:center;
  justify-content:center;
  padding: 56px 20px;
  position:relative;
  overflow-x:hidden;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 28px 28px;
  pointer-events:none;
}
#domainSelect{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--amber);background:transparent;border:1px solid var(--amber);padding:11px 12px;cursor:pointer;}

.wrap{
  width:100%;
  max-width:720px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:24px;
  position:relative;
  z-index:1;
}
.header{
  width:100%;
  border-bottom: 1px solid rgba(220,213,191,0.25);
  padding-bottom:14px;
  display:flex;
  justify-content:space-between;
  align-items:baseline;
}
h1{
  font-family:'IBM Plex Mono', monospace;
  font-weight:500;
  font-size:13px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  margin:0;
}
.sub{
  margin:0;
  color:var(--ink-faint);
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
}
.card-slot{
  position:relative;
  width:100%;
}
.card{
  position:relative;
  background: var(--paper);
  color: var(--card-ink);
  padding: 30px 30px 0;
  border: 1px solid var(--card-ink);
  box-shadow: 6px 6px 0 rgba(0,0,0,0.28);
}
.card.drawn{ animation: settle .2s linear; }
@keyframes settle{
  0%{ opacity:0.4; }
  100%{ opacity:1; }
}
.crop{
  position:absolute;
  width:10px; height:10px;
  border: 1px solid var(--card-ink);
  opacity:0.6;
}
.crop.tl{ top:-1px; left:-1px; border-right:none; border-bottom:none; }
.crop.br{ bottom:-1px; right:-1px; border-left:none; border-top:none; }
.card-body{
  min-height:180px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding: 24px 8px 32px;
}
.placeholder{
  color: rgba(18,35,58,0.4);
  font-family:'IBM Plex Mono', monospace;
  font-size:13px;
  text-align:center;
}
.name{
  font-family:'IBM Plex Mono', monospace;
  font-weight:600;
  font-size:14px;
  letter-spacing:0.2px;
  text-transform:uppercase;
  margin-bottom:12px;
}
.formula{
  min-height:72px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:12px 8px;
  overflow-x:auto;
  font-size:1.55rem;
  line-height:1.6;
}
.formula mjx-container{
  margin:0 !important;
  max-width:100%;
}
.title-block{
  border-top: 1px solid var(--card-ink);
  display:grid;
  grid-template-columns: 1fr 1fr;
}
.tb-cell{
  padding: 7px 12px;
  border-right: 1px solid var(--card-ink);
}
.tb-cell:last-child{ border-right:none; }
.tb-label{
  font-family:'IBM Plex Mono', monospace;
  font-size:8.5px;
  letter-spacing:1px;
  color: var(--card-ink-faint);
  text-transform:uppercase;
  display:block;
  margin-bottom:2px;
}
.tb-value{
  font-family:'IBM Plex Mono', monospace;
  font-size:11.5px;
}
button{
  font-family:'IBM Plex Mono', monospace;
  font-weight:500;
  font-size:12px;
  letter-spacing:1px;
  text-transform:uppercase;
  color: var(--amber);
  background: transparent;
  border: 1px solid var(--amber);
  padding:11px 26px;
  cursor:pointer;
}
button:hover{ background: var(--amber); color: var(--blueprint); }
button:active{ transform: translateY(1px); }

button:disabled:hover{ background:transparent; color:#5b6773; }
.status{
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  color:var(--ink-faint);
  text-align:center;
  letter-spacing:0.3px;
}
@media (prefers-reduced-motion: reduce){
  .card, .card.drawn{ animation:none; transition:none; }
}
.hint{
  text-align:center;
  font-family:'IBM Plex Mono', monospace;
  font-size:10px;
  letter-spacing:0.3px;
  color: var(--card-ink-faint);
  margin-top:2px;
}
.formula .def-hit{
  cursor:pointer;
  text-decoration: underline dotted;
  text-decoration-color: var(--card-ink-faint);
  text-underline-offset: 3px;
  border-radius:2px;
  transition: background-color .12s linear, color .12s linear;
}
.formula .def-hit:hover, .formula .def-hit.active{
  color: var(--amber);
  text-decoration-color: var(--amber);
}
.def-popover{
  position: fixed;
  z-index: 1000;
  max-width: 260px;
  background: var(--paper);
  color: var(--card-ink);
  border: 1px solid var(--card-ink);
  box-shadow: 6px 6px 0 rgba(0,0,0,0.28);
  padding: 14px 16px;
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 13px;
  line-height: 1.45;
}
.def-popover .crop{ width:8px; height:8px; }
.def-popover .sym{
  display:block;
  font-family:'IBM Plex Mono', monospace;
  font-weight:600;
  font-size:13px;
  color: var(--amber);
  margin-bottom:6px;
  letter-spacing:0.3px;
}
.def-popover .meaning{ color: var(--card-ink); }
.def-popover .close-hint{
  margin-top:9px;
  font-family:'IBM Plex Mono', monospace;
  font-size:9.5px;
  letter-spacing:0.5px;
  text-transform:uppercase;
  color: var(--card-ink-faint);
}

.calc{width:100%;border:1px solid rgba(220,213,191,0.35);padding:16px 18px;display:none;font-family:'IBM Plex Mono',monospace;}
.calc-head{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-faint);margin-bottom:14px;}
.calc select{font:inherit;color:var(--amber);background:var(--blueprint);border:1px solid var(--amber);padding:5px 8px;margin-left:6px;}
.calc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 18px;}
.calc-grid label{display:flex;align-items:center;gap:8px;border-bottom:1px solid rgba(220,213,191,0.3);}
.calc-grid .sym{color:var(--amber);font-size:13px;min-width:24px;}
.calc-grid input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--chalk);font:inherit;font-size:13px;padding:7px 2px;}
.calc-grid input::placeholder{color:rgba(220,213,191,0.28);font-size:10px;}
.calc-grid input:disabled{opacity:.3;}
.calc-out{margin-top:16px;font-size:15px;line-height:1.7;color:var(--paper);min-height:26px;}
.calc-out b{color:var(--amber);font-weight:600;}
.calc-out .ok{color:#8fd19e;}
.calc-hint{margin-top:10px;font-size:10px;color:var(--ink-faint);}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>Formula Reference</h1>
    <span class="sub">Rev. A</span>
  </div>
  <div class="card-slot">
    <div class="card" id="card">
      <div class="crop tl"></div>
      <div class="crop br"></div>
      <div class="card-body">
        <div class="placeholder" id="placeholder">— no card selected —</div>
        <div id="content" style="display:none;">
          <div class="name" id="lawName"></div>
          <div class="formula" id="formulaText"></div>
          <div class="hint" id="hintLine">Tap a symbol in the formula for its definition</div>
        </div>
      </div>
      <div class="title-block">
        <div class="tb-cell">
          <span class="tb-label">Card No.</span>
          <span class="tb-value" id="cardNo">—</span>
        </div>
        <div class="tb-cell">
          <span class="tb-label">Domain</span>
          <span class="tb-value" id="cardDomain">—</span>
        </div>
      </div>
    </div>
  </div>
  <div class="calc" id="calc">
    <div class="calc-head">
      <label>Solve for <select id="calcTarget"></select></label>
      <label><input type="checkbox" id="calcDeg" checked> angles in degrees</label>
    </div>
    <div class="calc-grid" id="calcGrid"></div>
    <div class="calc-out" id="calcOut"></div>
    <div class="calc-hint">Values can be expressions: 3/4, sqrt(2), pi/6. Degrees apply inside sin/cos/tan only — use radians for formulas like sector area.</div>
  </div>
  <select id="domainSelect" style="font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--amber);background:transparent;border:1px solid var(--amber);padding:11px 12px;cursor:pointer;">
    <option value="ALL">All domains</option>
  </select>
  <button id="drawBtn" disabled>Get formula</button>
  <div class="status" id="statusLine">Loading...</div>
</div>
<script>
let FORMULAS = [];
const cardEl = document.getElementById('card');
const placeholder = document.getElementById('placeholder');
const content = document.getElementById('content');
const lawName = document.getElementById('lawName');
const formulaText = document.getElementById('formulaText');
const cardNo = document.getElementById('cardNo');
const cardDomain = document.getElementById('cardDomain');
const btn = document.getElementById('drawBtn');
const statusLine = document.getElementById('statusLine');
const domainSelect = document.getElementById('domainSelect');

/* ---------- formula -> LaTeX conversion ----------
   Recursive, paren-balance-aware parser. Every recognized function name
   (sqrt, log, det, grad, int, ...) is matched as a whole token and its
   argument is located by matching brackets rather than a single flat
   regex, so nested parentheses (e.g. sqrt(p(p-a)(p-b)(p-c))) no longer
   fall through unconverted. Along the way, every symbol that has a
   definition also gets wrapped in \cssId/\class so it becomes directly
   clickable once MathJax renders it. */

const GREEK_LATEX = {
  alpha:'\\alpha', beta:'\\beta', gamma:'\\gamma', Gamma:'\\Gamma',
  delta:'\\delta', Delta:'\\Delta', epsilon:'\\varepsilon', zeta:'\\zeta',
  eta:'\\eta', theta:'\\theta', Theta:'\\Theta', iota:'\\iota',
  kappa:'\\kappa', lambda:'\\lambda', Lambda:'\\Lambda', mu:'\\mu', nu:'\\nu',
  xi:'\\xi', Xi:'\\Xi', pi:'\\pi', Pi:'\\Pi', rho:'\\rho', sigma:'\\sigma',
  Sigma:'\\Sigma', tau:'\\tau', upsilon:'\\upsilon', phi:'\\phi', Phi:'\\Phi',
  chi:'\\chi', psi:'\\psi', Psi:'\\Psi', omega:'\\omega', Omega:'\\Omega'
};
/* Built-in LaTeX operator commands (rendered upright automatically) */
const BUILTIN_FUNCS = new Set(['sin','cos','tan','cot','sec','csc','sinh','cosh','tanh','coth',
  'arcsin','arccos','arctan','log','ln','lg','exp','det','dim','gcd','lcm','hom','ker','deg',
  'arg','sup','lim','max','min','Pr']);
/* Functions with no built-in TeX command: typeset upright via \operatorname */
const OPERATORNAME_FUNCS = new Set(['grad','div','curl','proj','trans','circ','const','rot','var','cov','corr','rank','span']);
/* Pure symbol replacements (no argument is consumed) */
const SYMBOL_FUNCS = { sum:'\\sum', prod:'\\prod', nabla:'\\nabla' };

function findMatch(str, openIdx, openCh, closeCh){
  let depth = 0;
  for(let j = openIdx; j < str.length; j++){
    if(str[j] === openCh) depth++;
    else if(str[j] === closeCh){ depth--; if(depth === 0) return j; }
  }
  return -1;
}
function isLetter(ch){ return !!ch && /\p{L}/u.test(ch); }
function isDigit(ch){ return !!ch && /[0-9]/.test(ch); }
function topLevelSplit(str, sep){
  let depth = 0, out = [], last = 0;
  for(let j = 0; j < str.length; j++){
    const c = str[j];
    if(c === '(' || c === '[') depth++;
    else if(c === ')' || c === ']') depth--;
    else if(c === sep && depth === 0){ out.push(str.slice(last, j)); last = j + 1; }
  }
  out.push(str.slice(last));
  return out;
}

function toLatex(raw, symbolSet, idPrefix){
  const src = String(raw).trim();
  const idMap = {};
  let counter = 0;

  function renderSub(sub){
    if(/^[0-9]+$/.test(sub) || sub.length === 1) return sub;
    return '\\text{' + sub + '}';
  }
  function wrapIfSymbol(fullToken, wordOnly, visual){
    let key = null;
    if(symbolSet.has(fullToken)) key = fullToken;
    else if(symbolSet.has(wordOnly)) key = wordOnly;
    if(key === null) return visual;
    const id = idPrefix + (counter++);
    idMap[id] = key;
    return '\\cssId{' + id + '}{\\class{def-hit}{' + visual + '}}';
  }

  function parse(str){
    let out = '', idx = 0;
    const n = str.length;
    while(idx < n){
      const ch = str[idx];
      if(/\s/.test(ch)){ out += ch; idx++; continue; }
      if(str.startsWith('+-', idx)){ out += '\\pm '; idx += 2; continue; }
      if(str.startsWith('->', idx)){ out += '\\to '; idx += 2; continue; }
      if(str.startsWith('<=', idx)){ out += '\\le '; idx += 2; continue; }
      if(str.startsWith('>=', idx)){ out += '\\ge '; idx += 2; continue; }
      if(str.startsWith('!=', idx)){ out += '\\ne '; idx += 2; continue; }
      if(str.startsWith('...', idx)){ out += '\\ldots '; idx += 3; continue; }
      if(ch === '*'){ out += '\\cdot '; idx++; continue; }
      if(ch === '~'){ out += '\\approx '; idx++; continue; }
      if(ch === '/'){ out += ' / '; idx++; continue; }
      if(ch === '|'){
        const close = str.indexOf('|', idx + 1);
        if(close !== -1){ out += '\\left|' + parse(str.slice(idx+1, close)) + '\\right|'; idx = close + 1; continue; }
        out += '|'; idx++; continue;
      }
      if(ch === '^'){
        idx++;
        if(str[idx] === '('){
          const close = findMatch(str, idx, '(', ')');
          if(close !== -1){ out += '^{' + parse(str.slice(idx+1, close)) + '}'; idx = close + 1; continue; }
        }
        let j = idx;
        if(str[j] === '-') j++;
        const start = j;
        while(j < n && (isLetter(str[j]) || isDigit(str[j]))) j++;
        if(j > start){ out += '^{' + str.slice(idx, j) + '}'; idx = j; continue; }
        out += '^'; continue;
      }
      if(ch === '('){
        const close = findMatch(str, idx, '(', ')');
        if(close !== -1){ out += '(' + parse(str.slice(idx+1, close)) + ')'; idx = close + 1; continue; }
        out += '('; idx++; continue;
      }
      if(ch === '['){
        const close = findMatch(str, idx, '[', ']');
        if(close !== -1){
          const inner = str.slice(idx+1, close);
          if(inner.includes(';')){
            const rows = inner.split(';').map(row => topLevelSplit(row.trim(), ' ').filter(Boolean).map(parse).join(' & '));
            out += '\\begin{bmatrix}' + rows.join('\\\\') + '\\end{bmatrix}';
          } else if(inner.includes(',') && /^[a-zA-Z0-9\s.,+\-*/^_]*$/.test(inner)){
            const parts = topLevelSplit(inner, ',');
            if(parts.length === 2){ out += '_{' + parse(parts[0].trim()) + '}^{' + parse(parts[1].trim()) + '}'; idx = close + 1; continue; }
            out += '[' + parse(inner) + ']';
          } else {
            out += '[' + parse(inner) + ']';
          }
          idx = close + 1; continue;
        }
        out += '['; idx++; continue;
      }
      if(isDigit(ch)){
        let j = idx;
        while(j < n && (isDigit(str[j]) || str[j] === '.')) j++;
        out += str.slice(idx, j); idx = j; continue;
      }
      if(isLetter(ch)){
        let j = idx;
        while(j < n && isLetter(str[j])) j++;
        let word = str.slice(idx, j);
        let subscript = '', consumedTo = j;
        if(str[j] === '_'){
          let k = j + 1;
          while(k < n && (isLetter(str[k]) || isDigit(str[k]))) k++;
          subscript = str.slice(j+1, k); consumedTo = k;
        } else if(isDigit(str[j])){
          let k = j;
          while(k < n && isDigit(str[k])) k++;
          subscript = str.slice(j, k); consumedTo = k;
        }
        const fullToken = str.slice(idx, consumedTo);
        idx = consumedTo;
        let skip = idx;
        while(skip < n && str[skip] === ' ') skip++;
        const followedByParen = str[skip] === '(';

        /* Fused notation with no separating space, e.g. "sinθ", "2πsqrt(...)":
           try to peel a known function name off the front or back of the word. */
        if(!(BUILTIN_FUNCS.has(word) || OPERATORNAME_FUNCS.has(word) || SYMBOL_FUNCS[word] ||
             word === 'sqrt' || word === 'int' || word === 'oint' || word === 'dblint' ||
             word === 'tripleint' || word === 'surfint' || word === 'C' || word === 'mod' ||
             word === 'inf' || word === 'infty' || GREEK_LATEX[word] ||
             symbolSet.has(word) || symbolSet.has(fullToken))){
          const PREFIX_FUNCS = ['arcsin','arccos','arctan','sinh','cosh','tanh','sin','cos','tan','cot','sec','csc','log','ln','exp'];
          let matchedPrefix = null;
          for(const name of PREFIX_FUNCS){
            if(word.length > name.length && word.startsWith(name)){ matchedPrefix = name; break; }
          }
          if(matchedPrefix){
            const remainder = word.slice(matchedPrefix.length);
            const remFull = remainder + subscript;
            let visual = GREEK_LATEX[remainder] || remainder;
            if(subscript) visual += '_{' + renderSub(subscript) + '}';
            out += '\\' + matchedPrefix + ' ' + wrapIfSymbol(remFull, remainder, visual);
            continue;
          }
          const SUFFIX_FUNCS = ['sqrt','arcsin','arccos','arctan','sinh','cosh','tanh','sin','cos','tan','cot','sec','csc','log','ln','exp'];
          for(const name of SUFFIX_FUNCS){
            if(word.length > name.length && word.endsWith(name)){
              out += parse(word.slice(0, word.length - name.length));
              word = name;
              break;
            }
          }
        }
        if(word === 'mod'){ out += '\\bmod '; continue; }

        /* sqrt: always needs braces, not visible parens */
        if(word === 'sqrt' && followedByParen){
          const openIdx = skip;
          const close = findMatch(str, openIdx, '(', ')');
          if(close !== -1){ out += '\\sqrt{' + parse(str.slice(openIdx+1, close)) + '}'; idx = close + 1; continue; }
        }
        if(word === 'int' || word === 'oint'){
          let cmd = word === 'int' ? '\\int' : '\\oint';
          if(str[idx] === '['){
            const close = findMatch(str, idx, '[', ']');
            if(close !== -1){
              const parts = topLevelSplit(str.slice(idx+1, close), ',');
              if(parts.length === 2) cmd += '_{' + parse(parts[0].trim()) + '}^{' + parse(parts[1].trim()) + '}';
              idx = close + 1;
            }
          }
          out += cmd + ' '; continue;
        }
        if(word === 'dblint'){ out += '\\iint '; continue; }
        if(word === 'tripleint'){ out += '\\iiint '; continue; }
        if(word === 'surfint'){ out += '\\unicode{x222F} '; continue; }
        if(word === 'infty' || (word === 'inf' && !followedByParen)){ out += '\\infty '; continue; }
        if(SYMBOL_FUNCS[word]){ out += SYMBOL_FUNCS[word] + ' '; continue; }
        if(word === 'C' && followedByParen){
          const close = findMatch(str, skip, '(', ')');
          if(close !== -1){
            const parts = topLevelSplit(str.slice(skip+1, close), ',');
            if(parts.length === 2){ out += '\\binom{' + parse(parts[0].trim()) + '}{' + parse(parts[1].trim()) + '}'; idx = close + 1; continue; }
          }
        }
        if(BUILTIN_FUNCS.has(word) || OPERATORNAME_FUNCS.has(word)){
          let cmd = BUILTIN_FUNCS.has(word) ? ('\\' + word) : ('\\operatorname{' + word + '}');
          if(subscript) cmd += '_{' + renderSub(subscript) + '}';
          if(followedByParen){
            const close = findMatch(str, skip, '(', ')');
            if(close !== -1){ out += cmd + '(' + parse(str.slice(skip+1, close)) + ')'; idx = close + 1; continue; }
          }
          out += cmd + ' '; continue;
        }

        /* plain symbol/variable */
        let visual = GREEK_LATEX[word] || word;
        if(subscript) visual += '_{' + renderSub(subscript) + '}';
        out += wrapIfSymbol(fullToken, word, visual);
        continue;
      }
      out += ch; idx++;
    }
    return out;
  }

  return { latex: parse(src), idMap };
}

let FORMULA_VARS = {};

const KNOWN_TOKENS = {
  NA: "Avogadro's number (≈6.022 × 10²³ mol⁻¹)",
  GDP: 'Gross domestic product',
  NPV: 'Net present value',
  IRR: 'Internal rate of return',
  PV: 'Present value',
  FV: 'Future value',
  PMT: 'Regular payment (annuity)',
  BMI: 'Body mass index',
  BMR: 'Basal metabolic rate',
  pH: 'pH — a measure of the acidity of a solution',
  pOH: 'Basicity index of a solution',
  pKa: 'Acid dissociation constant exponent',
  hbar: 'Reduced Planck constant (ħ = h / 2π)',
  eps: 'EMF of the current source or permittivity (depends on context)',
  Isp: 'Specific impulse of the engine',
  Re: 'Reynolds number',
  Sharpe: 'Sharpe ratio',
  Cov: 'Covariance of random variables',
  Var: 'Variance of a random variable',
  const: 'Constant value',
  NPVt: 'Net present value at time t'
};
const GREEK = {
  alpha:'angle or coefficient (alpha) — meaning depends on the formula',
  beta:"beta coefficient — e.g., an asset's sensitivity to the market",
  gamma:'adiabatic index or gamma factor — depends on context',
  delta:'small change in a quantity (delta)',
  Delta:'change (difference) in a quantity',
  epsilon:'small quantity, strain, or permittivity',
  zeta:'damping coefficient (zeta)',
  eta:'efficiency (eta)',
  theta:'angle (theta)',
  iota:'small quantity (iota)',
  kappa:'coefficient, e.g., thermal conductivity (kappa)',
  lambda:'wavelength or eigenvalue (lambda)',
  mu:'coefficient of friction or magnetic permeability (mu)',
  nu:'frequency (nu)',
  xi:'random variable or small parameter (xi)',
  pi:'the number π ≈ 3.14159',
  rho:'density of a substance (rho)',
  sigma:'stress, standard deviation, or the Stefan–Boltzmann constant',
  tau:'time, torque, or time constant (tau)',
  upsilon:'parameter (upsilon)',
  phi:'angle or magnetic flux (phi)',
  chi:'parameter (chi)',
  psi:'wave function (psi)',
  omega:'angular velocity (omega)'
};
const LETTER_MEANINGS = {
  default: {
    a:'first quantity or coefficient', b:'second quantity or coefficient',
    c:'third quantity, often the speed of light', d:'differential or distance',
    e:"Euler's number (≈2.71828) or electron charge", f:'function or frequency',
    g:'acceleration due to gravity (≈9.8 m/s²)', h:'height or the Planck constant',
    i:'imaginary unit, index, or current', j:'index or current density',
    k:'coefficient, constant, or wavenumber', l:'length',
    m:'mass or quantity', n:'quantity, exponent, or number of moles',
    o:'origin', p:'pressure or momentum', q:'charge or amount of heat',
    r:'radius or distance', s:'path, area, or displacement', t:'time',
    u:'internal energy or velocity', v:'velocity', w:'work or angular velocity',
    x:'unknown quantity or coordinate', y:'coordinate or function value',
    z:'coordinate or complex number',
    A:'amplitude, area, or work', B:'magnetic induction', C:'capacitance or constant',
    D:'diameter or diffusion coefficient', E:'energy or field strength', F:'force',
    G:'gravitational constant', H:'magnetic field strength or enthalpy',
    I:'current or moment of inertia', J:'current density or angular momentum',
    K:'constant or coefficient', L:'inductance or length',
    M:'mass, moment of force, or molar mass', N:'quantity or number of particles',
    O:'origin', P:'power, pressure, or probability',
    Q:'amount of heat or charge', R:'resistance, radius, or gas constant',
    S:'area or entropy', T:'period, temperature, or tension',
    U:'voltage or internal energy', V:'volume or voltage',
    W:'work', X:'reactance or unknown quantity',
    Y:'modulus of elasticity or function value', Z:'total impedance'
  },
  'Mechanics': { m:'mass of the body', v:'velocity', a:'acceleration', F:'force', t:'time', h:'height', g:'acceleration due to gravity', P:'power or momentum', E:'energy', s:'distance traveled' },
  'Electricity & Magnetism': { I:'current', U:'voltage', R:'electrical resistance', q:'electric charge', C:'capacitance', B:'magnetic field induction', E:'electric field strength', F:'force (e.g., Lorentz)', k:"Coulomb's constant" },
  'Thermodynamics': { P:'gas pressure', V:'gas volume', T:'absolute temperature', n:'amount of substance (moles)', R:'universal gas constant', Q:'amount of heat', U:'internal energy', S:'entropy', A:'work done by the gas' },
  'Orbital Mechanics': { m:'mass of the body', M:'mass of the central body', G:'gravitational constant', R:'orbital or planetary radius', v:'orbital velocity', T:'orbital period', h:'height above the surface' },
  'Fluid & Aerodynamics': { P:'pressure', v:'flow velocity', S:'cross-sectional area', F:'force (buoyant, drag)', h:'depth or height of the liquid column' },
  'Optics & Waves': { n:'refractive index of the medium', v:'wave speed', f:'focal length or frequency', d:'distance to the object' },
  'Quantum & Nuclear Physics': { E:'energy', m:'mass of the particle', c:'speed of light', h:'Planck constant' },
  'Chemistry': { n:'amount of substance (moles)', N:'number of particles', M:'molar mass', m:'mass of the substance' },
  'Astronomy & Astrophysics': { L:'luminosity of the star', R:'radius of the star', T:'surface temperature of the star', z:'redshift' },
  'Statistics & Probability': { P:'probability of the event', A:'random event', n:'number of outcomes or observations', m:'number of favorable outcomes' },
  'Economics': { P:'principal (capital)', r:'interest rate', n:'number of compounding periods', A:'total amount', t:'time in years' },
  'Materials Science': { E:"Young's modulus", F:'applied force', S:'cross-sectional area' },
  'Rocketry': { F:'engine thrust' },
  'Computer Science': { n:'size of the input', N:'total number of possibilities', B:'bandwidth' },
  'Biology': { N:'population size', r:'population growth rate', K:'carrying capacity (maximum population size)', m:'mass of the body', h:'height' }
};
const STOPWORDS = new Set(['a','an','the','to','of','in','on','at','is','as','by','be','or','and','if','do','so','it','its','them','with','from','for','not','via','any','all','can','has','own','out','one','two','three','four','tree','trees','paths','edges','areas','angle','angles','degrees','degree','equal','equals','equally','equation','directions','transmitted','dividing','meet','medians','point','proportional','uniformly','repeatedly','tends','stays','stable','root','roots','ratio','rate','slope','mean','means','value','values','variable','variables','system','theorem','factorization','congruences','divisors','integer','number','numbers','sample','distribution','expected','weighted','average','central','characteristic','matrix','vertex','spanning','planar','nullity','rank','incidence','reflection','moves','move','meets','acted','contain','containing','satisfies','finds','sweeps','planet','planets','solar','dwarf','normal','couple','base','parallel','parallelepiped','phenotype','estimates','failure','gained','lost','long','short','shortest','stress','maximum','minimum','half','halves','white','colored','colors','congruent','cycles','count','births','deaths','years','unique','doubles','roughly','transistor','molecules','products','reactants','solution','solute','gases','uniformly']);
const FUNC_WORDS = new Set(['sin','cos','tan','cot','sec','csc','sinh','cosh','tanh','log','ln','exp','sqrt','lim','det','gcd','mod','sum','prod','max','min','arg','inf','sup','div','grad','curl','proj','trans','circ','const','and','or']);

function extractSymbols(raw){
  const tokens = String(raw).match(/[A-Za-zΑ-Ωα-ω]+/g) || [];
  const seen = new Set();
  const result = [];
  for(const tok of tokens){
    const lower = tok.toLowerCase();
    if(STOPWORDS.has(lower) || FUNC_WORDS.has(lower)) continue;
    if(seen.has(tok)) continue;
    seen.add(tok);
    result.push(tok);
  }
  return result;
}

function lookupMeaning(tok, domain, idx){
  const perFormula = FORMULA_VARS[idx];
  if(perFormula && Object.prototype.hasOwnProperty.call(perFormula, tok)){
    return perFormula[tok];
  }
  if(KNOWN_TOKENS[tok]) return KNOWN_TOKENS[tok];
  if(GREEK[tok]) return GREEK[tok];
  if(GREEK[tok.charAt(0).toLowerCase() + tok.slice(1)]) return GREEK[tok.charAt(0).toLowerCase() + tok.slice(1)];
  if(tok.length >= 2 && tok[0] === 'd'){
    const base = tok.slice(1);
    const baseMeaning = lookupMeaning(base, domain, idx);
    if(baseMeaning) return 'Infinitesimal change in the quantity "' + base + '"' + (baseMeaning ? ' (' + baseMeaning.charAt(0).toLowerCase() + baseMeaning.slice(1) + ')' : '');
  }
  const domainMap = LETTER_MEANINGS[domain];
  if(tok.length === 1){
    if(domainMap && domainMap[tok]) return domainMap[tok];
    if(LETTER_MEANINGS.default[tok]) return LETTER_MEANINGS.default[tok];
  }
  const m = tok.match(/^([A-Za-z])([A-Za-z0-9]{1,6})$/);
  if(m){
    const base = m[1], suffix = m[2];
    const baseMeaning = (domainMap && domainMap[base]) || LETTER_MEANINGS.default[base];
    if(baseMeaning) return baseMeaning + ', here with the qualifying subscript "' + suffix + '"';
  }
  return 'A symbol used in this formula — its exact meaning depends on the specific formula.';
}

/* ===== CALCULATOR: plug numbers into the shown formula, solve for any variable ===== */
let CALC=null, CALC_DEG=true;
const FN={sin:Math.sin,cos:Math.cos,tan:Math.tan,cot:x=>1/Math.tan(x),sec:x=>1/Math.cos(x),csc:x=>1/Math.sin(x),sinh:Math.sinh,cosh:Math.cosh,tanh:Math.tanh,ln:Math.log,log:Math.log10,exp:Math.exp,sqrt:Math.sqrt};
const TRIG=new Set(['sin','cos','tan','cot','sec','csc']);
function fact(n){ if(n<0||Math.abs(n-Math.round(n))>1e-9||n>170) return NaN; let r=1; for(let i=2;i<=Math.round(n);i++) r*=i; return r; }
const COMB={C:(n,k)=>fact(n)/(fact(k)*fact(n-k)), A:(n,k)=>fact(n)/fact(n-k), P:(n,k)=>fact(n)/fact(n-k)};
const fmt=v=>{ if(!isFinite(v)) return '—'; const r=parseFloat(v.toPrecision(10)); return (r!==0&&(Math.abs(r)>=1e12||Math.abs(r)<1e-6))?r.toExponential(6):String(r); };

/* formula string -> list of sides (split by "="), each {f(E,sign), used:Set, v:single-var|null, pm:bool}; throws if unsupported */
function compile(src, vars){
  src=src.replace(/π/g,'pi').replace(/θ/g,'theta').replace(/²/g,'^2').replace(/³/g,'^3').replace(/\+-/g,'±');
  const names=[...vars,...Object.keys(FN),'pi','e'].sort((a,b)=>b.length-a.length), T=[];
  for(let i=0,m;i<src.length;){
    const ch=src[i];
    if(/\s/.test(ch)){i++;continue;}
    if(m=/^\d+(\.\d+)?/.exec(src.slice(i))){T.push({n:+m[0]});i+=m[0].length;continue;}
    if(/[A-Za-z]/.test(ch)){const nm=names.find(x=>src.startsWith(x,i)); if(!nm) throw 0; T.push({id:nm}); i+=nm.length; continue;}
    if('()[]|^*/+-±!,='.includes(ch)){T.push({o:ch});i++;continue;}
    throw 0;
  }
  let p=0, abs=0, used, pm, piN=0;
  const isO=c=>T[p]&&T[p].o===c, eat=c=>{ if(!isO(c)) throw 0; p++; };
  const sf=()=>{const t=T[p]; return t&&(t.n!==undefined||t.id||t.o==='('||t.o==='['||(t.o==='|'&&!abs));};
  const mul=(l,r)=>(E,s)=>l(E,s)*r(E,s);
  function expr(){
    let a=term();
    for(;;){
      const o=T[p]&&T[p].o;
      if(o!=='+'&&o!=='-'&&o!=='±') return a;
      p++; const l=a, r=term();
      if(o==='±') pm=true;
      a=o==='+'?(E,s)=>l(E,s)+r(E,s):o==='-'?(E,s)=>l(E,s)-r(E,s):(E,s)=>l(E,s)+s*r(E,s);
    }
  }
  function term(){
    let a=pw(), aLit=a.lit;
    for(;;){
      const t=T[p];
      if(t&&t.o==='*'){p++; a=mul(a,pw()); aLit=false;}
      else if(t&&t.o==='/'){
        p++; const l=a; let d=pw();
        /* "1/3 pi r" = (1/3)*pi*r, but "/ 2a" = /(2a) */
        if(!(aLit&&d.lit)) while(sf()) d=mul(d,pw());
        a=(E,s)=>l(E,s)/d(E,s); aLit=false;
      }
      else if(sf()){a=mul(a,pw()); aLit=false;}
      else return a;
    }
  }
  function pw(){
    if(isO('-')){p++; const f=pw(); return (E,s)=>-f(E,s);}
    if(isO('+')){p++; return pw();}
    const b=post();
    if(isO('^')){p++; const e=pw(); return (E,s)=>Math.pow(b(E,s),e(E,s));}
    return b;
  }
  function post(){ let a=atom(); while(isO('!')){p++; const f=a; a=(E,s)=>fact(f(E,s));} return a; }
  function atom(){
    const t=T[p++]; if(!t) throw 0;
    if(t.n!==undefined){const f=()=>t.n; f.lit=true; return f;}
    if(t.o==='('||t.o==='['){const f=expr(); eat(t.o==='('?')':']'); return f;}
    if(t.o==='|'){abs++; const f=expr(); abs--; eat('|'); return (E,s)=>Math.abs(f(E,s));}
    const id=t.id; if(!id) throw 0;
    if(FN[id]){
      let ex=null; if(isO('^')){p++; ex=post();}
      const p0=piN; let a; if(isO('(')){p++; a=expr(); eat(')');} else a=pw();
      const g=FN[id], tr=TRIG.has(id)&&piN===p0;   /* arg contains pi -> already radians */
      return (E,s)=>{ let v=a(E,s); if(tr&&CALC_DEG) v*=Math.PI/180; v=g(v); return ex?Math.pow(v,ex(E,s)):v; };
    }
    if(COMB[id]&&isO('(')){p++; const n=expr(); eat(','); const k=expr(); eat(')'); return (E,s)=>COMB[id](n(E,s),k(E,s));}
    if(vars.has(id)){
      if('fFT'.includes(id)&&isO('(')) throw 0;   /* f(x) is a function call, not f*(x) */
      used.add(id); return E=>E[id];
    }
    if(id==='pi'){piN++; return ()=>Math.PI;}
    if(id==='e') return ()=>Math.E;
    throw 0;
  }
  const sides=[];
  for(;;){
    used=new Set(); pm=false; const st=p, f=expr();
    sides.push({f, used, pm, v:(p-st===1&&T[st].id&&vars.has(T[st].id))?T[st].id:null});
    if(isO('=')){p++;continue;} break;
  }
  if(p<T.length) throw 0;
  return sides;
}

function buildCalc(idx,item){
  const vm=FORMULA_VARS[idx]||{}; let names=Object.keys(vm);
  if(!names.length) names=[...new Set(item.formula.replace(/sqrt|sinh|cosh|tanh|sin|cos|tan|cot|sec|csc|log|ln|exp|pi/g,'').match(/[A-Za-z]\d*/g)||[])];
  const vars=new Set(names.filter(n=>n!=='pi'&&!(n==='e'&&!/euler|natural|base/i.test(vm.e||'')&&names.length>3)));
  let sides; try{ sides=compile(item.formula,vars); }catch(e){ return null; }
  if(sides.length<2) return null;
  const all=new Set(); sides.forEach(s=>s.used.forEach(n=>all.add(n)));
  if(!all.size) return null;
  return {vm, sides, names:names.filter(n=>all.has(n))};
}

function findRoots(L,R,t,E,vm){
  const F=x=>{E[t]=x; return L.f(E,1)-R.f(E,1);};
  const xs=[];
  if(/angle/i.test(vm[t]||'')){ const hi=CALC_DEG?180:Math.PI; for(let i=0;i<=1800;i++) xs.push(hi*i/1800); }
  else{ for(let i=-4000;i<=4000;i++) xs.push(i/40); for(let k=-6;k<=6;k++) for(let m=1;m<10;m++) xs.push(m*10**k,-m*10**k); xs.sort((a,b)=>a-b); }
  const out=[]; let pa=xs[0], pf=F(pa); if(pf===0) out.push(pa);
  for(let i=1;i<xs.length;i++){
    const b=xs[i], fb=F(b);
    if(fb===0&&b!==pa) out.push(b);
    else if(isFinite(pf)&&isFinite(fb)&&pf*fb<0){
      let lo=pa,hi=b,flo=pf;
      for(let k=0;k<100;k++){ const m=(lo+hi)/2, fm=F(m); if(fm*flo<=0) hi=m; else{lo=m;flo=fm;} }
      const r=(lo+hi)/2, fr=Math.abs(F(r)), sc=1+Math.abs(L.f(E,1))+Math.abs(R.f(E,1));
      if(fr<1e-6*sc) out.push(r);   /* rejects sign flips across poles */
    }
    pa=b; pf=fb;
  }
  delete E[t];
  out.sort((a,b)=>a-b);
  const uniq=out.filter((v,i)=>i===0||Math.abs(v-out[i-1])>1e-7*(1+Math.abs(v)));
  return [...uniq.filter(v=>v>0),...uniq.filter(v=>v<=0)];
}

function parseVal(str){
  try{ const s=compile(str,new Set()); const v=s[0].f({},1); return s.length===1&&isFinite(v)?v:NaN; }catch(e){ return NaN; }
}

function runCalc(){
  const out=document.getElementById('calcOut'), t=document.getElementById('calcTarget').value, E={}, bad=[];
  CALC.names.forEach(n=>{
    const inp=document.querySelector('#calcGrid input[data-v="'+n+'"]'); inp.disabled=(n===t);
    if(n===t) return;
    const s=inp.value.trim(); if(!s) return;
    const v=parseVal(s); if(isNaN(v)) bad.push(n); else E[n]=v;
  });
  if(bad.length){ out.textContent='Cannot read the value of: '+bad.join(', '); return; }
  const S=CALC.sides, miss=n=>!(n in E), vals=s=>(s.pm?[1,-1]:[1]).map(k=>s.f(E,k));
  if(!t){   /* check mode: evaluate every side, see if they match */
    const res=S.map(s=>[...s.used].some(miss)?null:vals(s));
    const need=new Set(); S.forEach(s=>s.used.forEach(n=>miss(n)&&need.add(n)));
    if(need.size){ out.textContent='Fill in: '+[...need].join(', '); return; }
    const flat=res.map(r=>r.map(fmt).join(' / '));
    const same=res.every(r=>Math.abs(r[0]-res[0][0])<=1e-9*(1+Math.abs(res[0][0])));
    out.innerHTML=flat.map((x,i)=>'side '+(i+1)+' = '+x).join('<br>')+'<br>'+(same?'<span class="ok">✓ both sides are equal</span>':'✗ sides are not equal');
    return;
  }
  const res=[], need=new Set();
  for(let i=0;i<S.length-1&&!res.length;i++){
    const L=S[i], R=S[i+1];
    if(!L.used.has(t)&&!R.used.has(t)) continue;
    const m=[...L.used,...R.used].filter(n=>n!==t&&miss(n));
    if(m.length){ m.forEach(n=>need.add(n)); continue; }
    const dir=(A,B)=>A.v===t&&!B.used.has(t)?vals(B):null;
    (dir(L,R)||dir(R,L)||findRoots(L,R,t,E,CALC.vm)).filter(isFinite).forEach(v=>res.push(v));
  }
  if(res.length) out.innerHTML=res.map((v,i)=>t+(res.length>1?'<sub>'+(i+1)+'</sub>':'')+' = <b>'+fmt(v)+'</b>').join('<br>');
  else if(need.size) out.textContent='Fill in: '+[...need].join(', ');
  else out.textContent='No real solution for these values';
}

function setupCalc(idx,item){
  CALC=buildCalc(idx,item);
  const box=document.getElementById('calc');
  if(!CALC){ box.style.display='none'; return; }
  box.style.display='block';
  const tgt=document.getElementById('calcTarget'), grid=document.getElementById('calcGrid');
  tgt.innerHTML='<option value="">check both sides</option>';
  grid.innerHTML='';
  CALC.names.forEach(n=>{
    const o=document.createElement('option'); o.value=o.textContent=n; tgt.appendChild(o);
    const lab=document.createElement('label'), sym=document.createElement('span'), inp=document.createElement('input');
    sym.className='sym'; sym.textContent=n; inp.dataset.v=n; inp.placeholder=CALC.vm[n]||''; inp.title=CALC.vm[n]||''; inp.autocomplete='off';
    inp.addEventListener('input',runCalc); lab.append(sym,inp); grid.appendChild(lab);
  });
  tgt.value=CALC.sides[0].v||'';
  runCalc();
}
document.addEventListener('change',e=>{ if(!CALC) return; if(e.target.id==='calcDeg') CALC_DEG=e.target.checked; if(e.target.id==='calcTarget'||e.target.id==='calcDeg') runCalc(); });

let activePopover = null;
function closePopover(){
  if(activePopover){ activePopover.el.remove(); activePopover.hit.classList.remove('active'); activePopover = null; }
}
document.addEventListener('click', (e) => {
  if(activePopover && !activePopover.el.contains(e.target) && e.target !== activePopover.hit){
    closePopover();
  }
});
document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closePopover(); });
window.addEventListener('scroll', closePopover, true);
window.addEventListener('resize', closePopover);

function showPopover(hitEl, symbol, meaning){
  if(activePopover && activePopover.hit === hitEl){ closePopover(); return; }
  closePopover();
  const pop = document.createElement('div');
  pop.className = 'def-popover';
  pop.innerHTML = '<span class="sym">' + symbol + '</span><span class="meaning"></span><div class="close-hint">Tap again to close</div>';
  pop.querySelector('.meaning').textContent = meaning;
  document.body.appendChild(pop);
  const hitRect = hitEl.getBoundingClientRect();
  const popRect = pop.getBoundingClientRect();
  let left = hitRect.left + hitRect.width / 2 - popRect.width / 2;
  left = Math.max(8, Math.min(left, window.innerWidth - popRect.width - 8));
  let top = hitRect.bottom + 8;
  if(top + popRect.height > window.innerHeight - 8){
    top = hitRect.top - popRect.height - 8;
  }
  pop.style.left = left + 'px';
  pop.style.top = top + 'px';
  hitEl.classList.add('active');
  activePopover = { el: pop, hit: hitEl };
}

function wireFormulaClicks(idMap, domain, idx){
  Object.keys(idMap).forEach(id => {
    const el = document.getElementById(id);
    if(!el) return;
    el.style.pointerEvents = 'auto';
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      showPopover(el, idMap[id], lookupMeaning(idMap[id], domain, idx));
    });
  });
}

function draw(){
  if(FORMULAS.length === 0) return;
  const pool = domainSelect.value === 'ALL'
    ? FORMULAS
    : FORMULAS.filter(item => (item.domain || item.category || 'General') === domainSelect.value);
  if(pool.length === 0) return;
  const item = pool[Math.floor(Math.random() * pool.length)];
  const idx = FORMULAS.indexOf(item);
  const domain = item.domain || item.category || 'General';
  const perFormula = FORMULA_VARS[idx];
  const symbols = (perFormula && Object.keys(perFormula).length)
    ? Object.keys(perFormula)
    : extractSymbols(item.formula);
  const symbolSet = new Set(symbols);

  placeholder.style.display = 'none';
  content.style.display = 'block';
  lawName.textContent = item.name;
  closePopover();

  const { latex, idMap } = toLatex(item.formula, symbolSet, 'sym' + idx + '_');
  formulaText.innerHTML = '<span>\\(' + latex + '\\)</span>';
  MathJax.typesetPromise([formulaText]).then(() => {
    wireFormulaClicks(idMap, domain, idx);
  });

  cardNo.textContent = String(idx + 1).padStart(3, '0');
  cardDomain.textContent = item.domain || item.category || '—';
  setupCalc(idx, item);
  cardEl.classList.remove('drawn');
  void cardEl.offsetWidth; 
  cardEl.classList.add('drawn');
}
btn.addEventListener('click', draw);

Promise.all([
  fetch('./formulas.json').then(res => res.json()),
  fetch('./formula_vars.json').then(res => res.json()).catch(() => ({}))
])
  .then(([formulasData, formulaVarsData]) => {
    FORMULAS = formulasData;
    FORMULA_VARS = formulaVarsData || {};
    [...new Set(FORMULAS.map(item => item.domain || item.category || 'General'))]
      .sort((a,b) => a.localeCompare(b))
      .forEach(domain => {
        const option = document.createElement('option');
        option.value = domain;
        option.textContent = domain;
        domainSelect.appendChild(option);
      });
    statusLine.textContent = FORMULAS.length + ' formulas loaded';
    btn.disabled = false;
  })
  .catch(() => {
    statusLine.textContent = 'Could not load formulas.json — keep it in the same folder';
  });
</script>
