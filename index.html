<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formula Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --blueprint:       #0E2A47;
  --blueprint-deep:  #0A2038;
  --grid-line:       rgba(255,255,255,0.055);

  --paper:       #F0EAD6;
  --card-ink:    #12233A;
  --card-ink-faint: rgba(18,35,58,0.55);

  --amber:      #D99A34;
  --chalk:      #DCD5BF;
  --ink-faint:  rgba(220,213,191,0.5);
}

*{ box-sizing:border-box; }
html,body{ margin:0; min-height:100vh; }

body{
  font-family:'IBM Plex Sans', sans-serif;
  color:var(--chalk);
  background: var(--blueprint);
  display:flex;
  align-items:center;
  justify-content:center;
  padding: 56px 20px;
  position:relative;
  overflow-x:hidden;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 28px 28px;
  pointer-events:none;
}

.wrap{
  width:100%;
  max-width:440px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:24px;
  position:relative;
  z-index:1;
}

/* ---------- the technical index card ---------- */
.card-slot{
  position:relative;
  width:100%;
}

.card{
  position:relative;
  background: var(--paper);
  color: var(--card-ink);
  padding: 24px 22px 0;
  border: 1px solid var(--card-ink);
  box-shadow: 6px 6px 0 rgba(0,0,0,0.28);
}
.card.drawn{ animation: settle .2s linear; }
@keyframes settle{
  0%{ opacity:0.4; }
  100%{ opacity:1; }
}

/* registration marks, like a drafting sheet */
.crop{
  position:absolute;
  width:10px; height:10px;
  border: 1px solid var(--card-ink);
  opacity:0.6;
}
.crop.tl{ top:-1px; left:-1px; border-right:none; border-bottom:none; }
.crop.br{ bottom:-1px; right:-1px; border-left:none; border-top:none; }

.card-body{
  min-height:118px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding: 14px 4px 22px;
}

.placeholder{
  color: rgba(18,35,58,0.4);
  font-family:'IBM Plex Mono', monospace;
  font-size:13px;
  text-align:center;
}

.name{
  font-family:'IBM Plex Mono', monospace;
  font-weight:600;
  font-size:14px;
  letter-spacing:0.2px;
  text-transform:uppercase;
  margin-bottom:12px;
}

.formula{
  font-family:'IBM Plex Mono', monospace;
  font-size:15px;
  border-left: 2px solid var(--card-ink);
  padding:2px 0 2px 12px;
  word-break: break-word;
}

/* title block, like the corner of an engineering drawing */
.title-block{
  border-top: 1px solid var(--card-ink);
}
.tb-cell{
  padding: 7px 12px;
}
.tb-label{
  font-family:'IBM Plex Mono', monospace;
  font-size:8.5px;
  letter-spacing:1px;
  color: var(--card-ink-faint);
  text-transform:uppercase;
  display:block;
  margin-bottom:2px;
}
.tb-value{
  font-family:'IBM Plex Mono', monospace;
  font-size:11.5px;
}

/* ---------- controls ---------- */
button{
  font-family:'IBM Plex Mono', monospace;
  font-weight:500;
  font-size:12px;
  letter-spacing:1px;
  text-transform:uppercase;
  color: var(--amber);
  background: transparent;
  border: 1px solid var(--amber);
  padding:11px 26px;
  cursor:pointer;
}
button:hover{ background: var(--amber); color: var(--blueprint); }
button:active{ transform: translateY(1px); }
button:disabled{ border-color:#5b6773; color:#5b6773; cursor:default; }
button:disabled:hover{ background:transparent; color:#5b6773; }

.status{
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  color:var(--ink-faint);
  text-align:center;
  letter-spacing:0.3px;
}

@media (prefers-reduced-motion: reduce){
  .card, .card.drawn{ animation:none; transition:none; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="card-slot">
    <div class="card" id="card">
      <div class="crop tl"></div>
      <div class="crop br"></div>

      <div class="card-body">
        <div class="placeholder" id="placeholder">— no card selected —</div>
        <div id="content" style="display:none;">
          <div class="name" id="lawName"></div>
          <div class="formula" id="formulaText"></div>
        </div>
      </div>

      <div class="title-block">
        <div class="tb-cell">
          <span class="tb-label">Card No.</span>
          <span class="tb-value" id="cardNo">—</span>
        </div>
      </div>
    </div>
  </div>

  <button id="drawBtn" disabled>Get formula</button>
  <div class="status" id="statusLine">Loading...</div>
</div>

<script>
let FORMULAS = [];

const cardEl = document.getElementById('card');
const placeholder = document.getElementById('placeholder');
const content = document.getElementById('content');
const lawName = document.getElementById('lawName');
const formulaText = document.getElementById('formulaText');
const cardNo = document.getElementById('cardNo');
const btn = document.getElementById('drawBtn');
const statusLine = document.getElementById('statusLine');

function draw(){
  if(FORMULAS.length === 0) return;
  const idx = Math.floor(Math.random() * FORMULAS.length);
  const item = FORMULAS[idx];

  placeholder.style.display = 'none';
  content.style.display = 'block';
  lawName.textContent = item.name;
  formulaText.textContent = item.formula;
  cardNo.textContent = String(idx + 1).padStart(3, '0');

  cardEl.classList.remove('drawn');
  void cardEl.offsetWidth; // restart animation
  cardEl.classList.add('drawn');
}

btn.addEventListener('click', draw);

fetch('./formulas.json')
  .then(res => res.json())
  .then(data => {
    FORMULAS = data;
    statusLine.textContent = FORMULAS.length + ' formulas loaded';
    btn.disabled = false;
  })
  .catch(() => {
    statusLine.textContent = 'Could not load formulas.json — keep it in the same folder';
  });
</script>
</body>
</html>
