<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formula Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
:root{
  --blueprint:       #0E2A47;
  --blueprint-deep:  #0A2038;
  --grid-line:       rgba(255,255,255,0.055);
  --paper:       #F0EAD6;
  --card-ink:    #12233A;
  --card-ink-faint: rgba(18,35,58,0.55);
  --amber:      #D99A34;
  --chalk:      #DCD5BF;
  --ink-faint:  rgba(220,213,191,0.5);
}
*{ box-sizing:border-box; }
html,body{ margin:0; min-height:100vh; }
body{
  font-family:'IBM Plex Sans', sans-serif;
  color:var(--chalk);
  background: var(--blueprint);
  display:flex;
  align-items:center;
  justify-content:center;
  padding: 56px 20px;
  position:relative;
  overflow-x:hidden;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 28px 28px;
  pointer-events:none;
}
#domainSelect{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--amber);background:transparent;border:1px solid var(--amber);padding:11px 12px;cursor:pointer;}

.wrap{
  width:100%;
  max-width:720px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:24px;
  position:relative;
  z-index:1;
}
.header{
  width:100%;
  border-bottom: 1px solid rgba(220,213,191,0.25);
  padding-bottom:14px;
  display:flex;
  justify-content:space-between;
  align-items:baseline;
}
h1{
  font-family:'IBM Plex Mono', monospace;
  font-weight:500;
  font-size:13px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  margin:0;
}
.sub{
  margin:0;
  color:var(--ink-faint);
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
}
.card-slot{
  position:relative;
  width:100%;
}
.card{
  position:relative;
  background: var(--paper);
  color: var(--card-ink);
  padding: 30px 30px 0;
  border: 1px solid var(--card-ink);
  box-shadow: 6px 6px 0 rgba(0,0,0,0.28);
}
.card.drawn{ animation: settle .2s linear; }
@keyframes settle{
  0%{ opacity:0.4; }
  100%{ opacity:1; }
}
.crop{
  position:absolute;
  width:10px; height:10px;
  border: 1px solid var(--card-ink);
  opacity:0.6;
}
.crop.tl{ top:-1px; left:-1px; border-right:none; border-bottom:none; }
.crop.br{ bottom:-1px; right:-1px; border-left:none; border-top:none; }
.card-body{
  min-height:180px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding: 24px 8px 32px;
}
.placeholder{
  color: rgba(18,35,58,0.4);
  font-family:'IBM Plex Mono', monospace;
  font-size:13px;
  text-align:center;
}
.name{
  font-family:'IBM Plex Mono', monospace;
  font-weight:600;
  font-size:14px;
  letter-spacing:0.2px;
  text-transform:uppercase;
  margin-bottom:12px;
}
.formula{
  min-height:72px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:12px 8px;
  overflow-x:auto;
  font-size:1.55rem;
  line-height:1.6;
}
.formula mjx-container{
  margin:0 !important;
  max-width:100%;
}
.title-block{
  border-top: 1px solid var(--card-ink);
  display:grid;
  grid-template-columns: 1fr 1fr;
}
.tb-cell{
  padding: 7px 12px;
  border-right: 1px solid var(--card-ink);
}
.tb-cell:last-child{ border-right:none; }
.tb-label{
  font-family:'IBM Plex Mono', monospace;
  font-size:8.5px;
  letter-spacing:1px;
  color: var(--card-ink-faint);
  text-transform:uppercase;
  display:block;
  margin-bottom:2px;
}
.tb-value{
  font-family:'IBM Plex Mono', monospace;
  font-size:11.5px;
}
button{
  font-family:'IBM Plex Mono', monospace;
  font-weight:500;
  font-size:12px;
  letter-spacing:1px;
  text-transform:uppercase;
  color: var(--amber);
  background: transparent;
  border: 1px solid var(--amber);
  padding:11px 26px;
  cursor:pointer;
}
button:hover{ background: var(--amber); color: var(--blueprint); }
button:active{ transform: translateY(1px); }

button:disabled:hover{ background:transparent; color:#5b6773; }
.status{
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  color:var(--ink-faint);
  text-align:center;
  letter-spacing:0.3px;
}
@media (prefers-reduced-motion: reduce){
  .card, .card.drawn{ animation:none; transition:none; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>Formula Reference</h1>
    <span class="sub">Rev. A</span>
  </div>
  <div class="card-slot">
    <div class="card" id="card">
      <div class="crop tl"></div>
      <div class="crop br"></div>
      <div class="card-body">
        <div class="placeholder" id="placeholder">— no card selected —</div>
        <div id="content" style="display:none;">
          <div class="name" id="lawName"></div>
          <div class="formula" id="formulaText"></div>
        </div>
      </div>
      <div class="title-block">
        <div class="tb-cell">
          <span class="tb-label">Card No.</span>
          <span class="tb-value" id="cardNo">—</span>
        </div>
        <div class="tb-cell">
          <span class="tb-label">Domain</span>
          <span class="tb-value" id="cardDomain">—</span>
        </div>
      </div>
    </div>
  </div>
  <select id="domainSelect" style="font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--amber);background:transparent;border:1px solid var(--amber);padding:11px 12px;cursor:pointer;">
    <option value="ALL">All domains</option>
  </select>
  <button id="drawBtn" disabled>Get formula</button>
  <div class="status" id="statusLine">Loading...</div>
</div>
<script>
let FORMULAS = [];
const cardEl = document.getElementById('card');
const placeholder = document.getElementById('placeholder');
const content = document.getElementById('content');
const lawName = document.getElementById('lawName');
const formulaText = document.getElementById('formulaText');
const cardNo = document.getElementById('cardNo');
const cardDomain = document.getElementById('cardDomain');
const btn = document.getElementById('drawBtn');
const statusLine = document.getElementById('statusLine');
const domainSelect = document.getElementById('domainSelect');
function toLatex(value){
  let s = String(value).trim();
  s = s.replace(/sqrt\s*\(([^()]*)\)/g, '\\sqrt{$1}');
  s = s.replace(/\bC\(([^,]+),([^\)]+)\)/g, '\\binom{$1}{$2}');
  s = s.replace(/\b(sum|prod)\b/g, m => m === 'sum' ? '\\sum' : '\\prod');
  s = s.replace(/([A-Za-z])([0-9]+)/g, '$1_{$2}');
  s = s.replace(/\^\(([^()]*)\)/g, '^{$1}');
  s = s.replace(/\^([A-Za-z0-9]+)/g, '^{$1}');
  s = s.replace(/\b(sin|cos|tan|cot|sec|csc|log|ln|exp|arcsin|arccos|arctan)\b/g, '\\$1');
  s = s.replace(/\bpi\b/gi, '\\pi');
  s = s.replace(/\bDelta\b/g, '\\Delta');
  s = s.replace(/\b(alpha|beta|gamma|theta|lambda|mu|rho|sigma|phi|omega)\b/gi, '\\$1');
  s = s.replace(/\+\-/g, '\\pm');
  s = s.replace(/!=/g, '\\ne');
  s = s.replace(/<=/g, '\\le');
  s = s.replace(/>=/g, '\\ge');
  s = s.replace(/\*/g, '\\cdot ');
  s = s.replace(/\//g, ' / ');
  s = s.replace(/\|([^|]+)\|/g, '\\left|$1\\right|');
  return s;
}

function draw(){
  if(FORMULAS.length === 0) return;
  const pool = domainSelect.value === 'ALL'
    ? FORMULAS
    : FORMULAS.filter(item => (item.domain || item.category || 'General') === domainSelect.value);
  if(pool.length === 0) return;
  const item = pool[Math.floor(Math.random() * pool.length)];
  const idx = FORMULAS.indexOf(item);
  placeholder.style.display = 'none';
  content.style.display = 'block';
  lawName.textContent = item.name;
  formulaText.innerHTML = '<span>\\(' + toLatex(item.formula) + '\\)</span>';
  MathJax.typesetPromise([formulaText]);
  cardNo.textContent = String(idx + 1).padStart(3, '0');
  cardDomain.textContent = item.domain || item.category || '—';
  cardEl.classList.remove('drawn');
  void cardEl.offsetWidth; 
  cardEl.classList.add('drawn');
}
btn.addEventListener('click', draw);
fetch('./formulas.json')
  .then(res => res.json())
  .then(data => {
    FORMULAS = data;
    [...new Set(FORMULAS.map(item => item.domain || item.category || 'General'))]
      .sort((a,b) => a.localeCompare(b))
      .forEach(domain => {
        const option = document.createElement('option');
        option.value = domain;
        option.textContent = domain;
        domainSelect.appendChild(option);
      });
    statusLine.textContent = FORMULAS.length + ' formulas loaded';
    btn.disabled = false;
  })
  .catch(() => {
    statusLine.textContent = 'Could not load formulas.json — keep it in the same folder';
  });
</script>
</body>
</html>
